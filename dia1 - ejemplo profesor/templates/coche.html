<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de coche</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .car-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .car-card:hover {
            transform: translateY(-2px);
        }

        .car-info h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .car-info p {
            margin: 0.25rem 0 0;
            color: #64748b;
        }

        .badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .nav {
            margin-bottom: 2rem;
        }

        .nav a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="nav">
        <a href="/">← Volver al Inicio</a>
    </div>

    <div class="container">
        <h1>Coches Registrados</h1>

        <div class="car-card">
            <div class="car-info">
                <h2>{{ coche.marca }}</h2>
                <p>{{ coche.modelo }}</p>
            </div>
            <span class="badge">{{ coche.ruedas }} Ruedas</span>
        </div>
    </div>
</body>

</html>
